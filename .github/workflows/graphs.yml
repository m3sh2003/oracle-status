name: Graphs CI
permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  release:
    name: Generate graphs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate graphs
        uses: upptime/uptime-monitor@master
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          COMMIT_EMAIL: "ci@example.com"
          COMMIT_NAME: "Uptime_CI"
          COMMIT_MSG: ":baby_chick: Update graphs [skip ci]"
