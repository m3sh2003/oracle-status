name: Static Site CI
permissions:
  contents: write

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
jobs:
  release:
    name: Build and deploy site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        uses: upptime/uptime-monitor@master
        with:
          command: "site"
        env:
          OWNER: m3sh2003
          REPO: oracle-status
          GH_PAT: ${{ secrets.GH_PAT }}
          COMMIT_EMAIL: "ci@example.com"
          COMMIT_NAME: "Uptime_CI"
          COMMIT_MSG: ":rocket: Deploy site [skip ci]"
      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./__sapper__/export
