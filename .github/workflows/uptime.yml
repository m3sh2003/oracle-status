name: Uptime CI
permissions:
  contents: write

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update status
        uses: upptime/uptime-monitor@master
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          COMMIT_EMAIL: "ci@example.com"
          COMMIT_NAME: "Uptime_CI"
          COMMIT_MSG: ":pencil2: Update README [skip ci]"
